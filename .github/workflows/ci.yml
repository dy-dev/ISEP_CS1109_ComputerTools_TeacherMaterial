# CI — CS.1109 Runner
#
# Runs on every push and every pull request. Two jobs:
#   build  : compiles the project on a bare Ubuntu runner and runs the tests
#   docker : builds the Docker image (which runs the tests inside), after build
#
# A red job blocks the pull request once branch protection is enabled.

name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships g++ and cmake, but not the libraries Raylib
      # needs to compile. Without this step the build fails at link time.
      - name: Install Raylib dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev \
                                  libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # runner_tests returns a non-zero code if a test fails, which fails
      # the step, the job, and the badge.
      - name: Test
        run: ./build/runner_tests

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Dockerfile runs the tests during the build: a failing test
      # makes docker build fail.
      - name: Build image
        run: docker build -t cs1109-runner .

      - name: Run tests in the container
        run: docker run --rm cs1109-runner
